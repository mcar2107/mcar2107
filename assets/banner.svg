<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07000f"/>
      <stop offset="0.74" stop-color="#1b0034"/>
      <stop offset="1" stop-color="#2a0045"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.5" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridFade"><rect x="0" y="222" width="1200" height="78" fill="url(#fade)"/></mask>
    <mask id="sunStripes">
      <rect x="0" y="0" width="1200" height="300" fill="#fff"/>
      <rect x="0" y="188" width="1200" height="3" fill="#000"/>
      <rect x="0" y="198" width="1200" height="5" fill="#000"/>
      <rect x="0" y="209" width="1200" height="7" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="222"/></clipPath>
    <filter id="sunBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800; font-size: 76px; letter-spacing: 8px;
    }
    .sub {
      font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 22px; letter-spacing: 4px;
    }
    .flicker { animation: flicker 7s linear infinite; }
    @keyframes flicker {
      0%, 41%, 43%, 45%, 78%, 80%, 100% { opacity: 1; }
      42%, 44%, 79% { opacity: 0.25; }
    }
    .pulse { animation: pulse 2.8s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 0.75; } to { opacity: 1; } }
    .scroll { animation: scroll 1.6s linear infinite; }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(19.5px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- звёзды -->
  <g fill="#fff" opacity="0.55">
    <circle cx="90" cy="40" r="1.2"/><circle cx="230" cy="92" r="0.9"/><circle cx="340" cy="28" r="1.4"/>
    <circle cx="470" cy="70" r="0.8"/><circle cx="760" cy="34" r="1.1"/><circle cx="880" cy="96" r="0.9"/>
    <circle cx="1010" cy="48" r="1.3"/><circle cx="1130" cy="110" r="0.8"/><circle cx="150" cy="150" r="0.9"/>
    <circle cx="1080" cy="170" r="1"/><circle cx="60" cy="200" r="0.8"/><circle cx="640" cy="18" r="0.9"/>
  </g>

  <!-- закатное солнце -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="600.0" cy="222" r="66" fill="#ff2975" opacity="0.35" filter="url(#sunBlur)"/>
    <circle cx="600.0" cy="222" r="56" fill="url(#sun)" opacity="0.75" mask="url(#sunStripes)"/>
  </g>

  <!-- synthwave-сетка -->
  <g mask="url(#gridFade)" stroke="#ff2a6d" stroke-width="1.4" opacity="0.8" filter="url(#softGlow)">
    <line x1="600.0" y1="222" x2="-940" y2="300"/><line x1="600.0" y1="222" x2="-830" y2="300"/><line x1="600.0" y1="222" x2="-720" y2="300"/><line x1="600.0" y1="222" x2="-610" y2="300"/><line x1="600.0" y1="222" x2="-500" y2="300"/><line x1="600.0" y1="222" x2="-390" y2="300"/><line x1="600.0" y1="222" x2="-280" y2="300"/><line x1="600.0" y1="222" x2="-170" y2="300"/><line x1="600.0" y1="222" x2="-60" y2="300"/><line x1="600.0" y1="222" x2="50" y2="300"/><line x1="600.0" y1="222" x2="160" y2="300"/><line x1="600.0" y1="222" x2="270" y2="300"/><line x1="600.0" y1="222" x2="380" y2="300"/><line x1="600.0" y1="222" x2="490" y2="300"/><line x1="600.0" y1="222" x2="600" y2="300"/><line x1="600.0" y1="222" x2="710" y2="300"/><line x1="600.0" y1="222" x2="820" y2="300"/><line x1="600.0" y1="222" x2="930" y2="300"/><line x1="600.0" y1="222" x2="1040" y2="300"/><line x1="600.0" y1="222" x2="1150" y2="300"/><line x1="600.0" y1="222" x2="1260" y2="300"/><line x1="600.0" y1="222" x2="1370" y2="300"/><line x1="600.0" y1="222" x2="1480" y2="300"/><line x1="600.0" y1="222" x2="1590" y2="300"/><line x1="600.0" y1="222" x2="1700" y2="300"/><line x1="600.0" y1="222" x2="1810" y2="300"/><line x1="600.0" y1="222" x2="1920" y2="300"/><line x1="600.0" y1="222" x2="2030" y2="300"/><line x1="600.0" y1="222" x2="2140" y2="300"/>
    <g class="scroll">
      <line x1="0" y1="226.7" x2="1200" y2="226.7"/><line x1="0" y1="232.9" x2="1200" y2="232.9"/><line x1="0" y1="241.5" x2="1200" y2="241.5"/><line x1="0" y1="252.4" x2="1200" y2="252.4"/><line x1="0" y1="265.7" x2="1200" y2="265.7"/><line x1="0" y1="281.3" x2="1200" y2="281.3"/><line x1="0" y1="300.0" x2="1200" y2="300.0"/>
      <line x1="0" y1="207.2" x2="1200" y2="207.2"/>
    </g>
  </g>
  <line x1="0" y1="222" x2="1200" y2="222" stroke="#ff7edb" stroke-width="2" filter="url(#softGlow)"/>

  <!-- имя -->
  <g class="flicker">
    <text x="600.0" y="118" text-anchor="middle" class="title" fill="none" stroke="#ff2a6d" stroke-width="3" filter="url(#glow)">MAKAR KOROLENKO</text>
    <text x="600.0" y="118" text-anchor="middle" class="title" fill="#ffe3f1" opacity="0.92">MAKAR KOROLENKO</text>
  </g>

  <!-- подзаголовок -->
  <g class="pulse">
    <text x="600.0" y="166" text-anchor="middle" class="sub" fill="#05d9e8" filter="url(#softGlow)">&lt;frontend dev /&gt; · amoCRM · Moscow<tspan class="blink">_</tspan></text>
  </g>
</svg>
