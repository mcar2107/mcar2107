<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ff2a6d"/>
      <stop offset="0.5" stop-color="#d300c5"/>
      <stop offset="0.8" stop-color="#05d9e8"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lineClip"><rect x="0" y="10" width="1200" height="4"/></clipPath>
  </defs>
  <style>
    .shine { animation: run 4s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
  </style>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)" filter="url(#glow)"/>
  <g clip-path="url(#lineClip)">
    <rect class="shine" x="0" y="10" width="200" height="4" fill="url(#shine)"/>
  </g>
</svg>
