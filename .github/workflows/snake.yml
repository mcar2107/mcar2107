name: Generate neon snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff2a6d&color_dots=#1f0b33,#4a0e78,#9d1dd6,#e01e9f,#05d9e8
            dist/snake-light.svg?color_snake=#ff2a6d&color_dots=#ece3f7,#c79bf0,#a259e6,#e01e9f,#05b8c9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
